<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Bran Flakes Options</title>
    <style>
      body {
        font-family: source-code-pro, Menlo, Monaco, Consolas, "Courier New", monospace;
        padding: 1rem;
        min-width: 300px;
      }
      label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
      input { width: 100%; padding: 0.4rem; box-sizing: border-box; font-family: inherit; }
      button { margin-top: 0.5rem; padding: 0.4rem 1rem; cursor: pointer; font-family: inherit; }
      #status { color: green; margin-left: 0.5rem; }
      #domain-display {
        padding: 0.4rem;
        background: #f5f5f5;
        border: 1px solid #ddd;
        border-radius: 3px;
        word-break: break-all;
      }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <label>Jira Domain</label>

    <div id="view-mode" class="hidden">
      <div id="domain-display"></div>
      <button id="edit-btn" type="button">Edit</button>
    </div>

    <div id="edit-mode">
      <form id="options-form">
        <input id="domain" type="text" placeholder="jira.example.com">
        <button type="submit">Save</button>
        <span id="status"></span>
      </form>
    </div>

    <script src="options.js" type="text/javascript"></script>
  </body>
</html>
