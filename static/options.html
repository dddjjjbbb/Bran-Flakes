<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Bran Flakes Options</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: 1rem;
        min-width: 300px;
      }
      label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
      input { width: 100%; padding: 0.4rem; box-sizing: border-box; }
      button { margin-top: 0.5rem; padding: 0.4rem 1rem; }
      #status { color: green; margin-left: 0.5rem; }
    </style>
  </head>
  <body>
    <form id="options-form">
      <label for="domain">Jira Domain</label>
      <input id="domain" type="text" placeholder="jira.example.com">
      <button type="submit">Save</button>
      <span id="status"></span>
    </form>
    <script src="options.js" type="text/javascript"></script>
  </body>
</html>
